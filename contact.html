<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>سامانه مصباح</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/contact.css">

</head>

<body>

    <!-- Header -->
    <div
        id="header"
        data-component="components/header.html">
    </div>

<main class="page contact-page">

    <section class="contact-intro">

        <h1>
            تماس با سامانه مصباح
        </h1>

        <p>
            برای ارتباط با سامانه مصباح، دریافت اطلاعات بیشتر
            و ارسال نظرات و پیشنهادهای خود می‌توانید از
            راه‌های ارتباطی زیر استفاده کنید.
        </p>

    </section>


    <section class="contact-section">

        <div class="contact-list">

            <!-- Phone -->
            <div class="contact-link">

                <span class="contact-link-icon">
                    <i class="fa-solid fa-phone"></i>
                </span>

                <span class="contact-link-content">

                    <span class="contact-link-title">
                        شماره تماس
                    </span>

                    <span class="contact-link-value">
                        ۰۲۱-۱۲۳۴۵۶۷۸
                    </span>

                </span>

                <span class="contact-actions">

                    <!-- تماس -->
                    <a href="tel:02112345678"
                    class="contact-action"
                    aria-label="تماس">
                        <i class="fa-solid fa-phone"></i>
                    </a>

                    <!-- کپی -->
                    <button class="copy-contact"
                            type="button"
                            data-copy="۰۲۱۱۲۳۴۵۶۷۸"
                            aria-label="کپی شماره تماس">
                        <i class="fa-regular fa-copy"></i>
                    </button>

                </span>

            </div>


            <!-- Email -->
            <div class="contact-link">

                <span class="contact-link-icon">
                    <i class="fa-regular fa-envelope"></i>
                </span>

                <span class="contact-link-content">

                    <span class="contact-link-title">
                        ایمیل
                    </span>

                    <span class="contact-link-value">
                        info@example.ir
                    </span>

                </span>

                <span class="contact-actions">

                    <a href="mailto:info@example.ir"
                    class="contact-action"
                    aria-label="ارسال ایمیل">
                        <i class="fa-regular fa-envelope"></i>
                    </a>

                    <button class="copy-contact"
                            type="button"
                            data-copy="info@example.ir"
                            aria-label="کپی ایمیل">
                        <i class="fa-regular fa-copy"></i>
                    </button>

                </span>

            </div>


            <!-- Telegram -->
            <div class="contact-link">

                <span class="contact-link-icon">
                    <i class="fa-brands fa-telegram"></i>
                </span>

                <span class="contact-link-content">

                    <span class="contact-link-title">
                        تلگرام
                    </span>

                    <span class="contact-link-value">
                        @mesbah
                    </span>

                </span>

                <span class="contact-actions">

                    <a href="#"
                    class="contact-action"
                    aria-label="رفتن به تلگرام">
                        <i class="fa-solid fa-arrow-up-right-from-square"></i>
                    </a>

                    <button class="copy-contact"
                            type="button"
                            data-copy="@mesbah"
                            aria-label="کپی آیدی تلگرام">
                        <i class="fa-regular fa-copy"></i>
                    </button>

                </span>

            </div>


            <!-- Bale -->
            <div class="contact-link">

                <span class="contact-link-icon">
                    <i class="fa-solid fa-paper-plane"></i>
                </span>

                <span class="contact-link-content">

                    <span class="contact-link-title">
                        بله
                    </span>

                    <span class="contact-link-value">
                        @mesbah
                    </span>

                </span>

                <span class="contact-actions">

                    <a href="#"
                    class="contact-action"
                    aria-label="رفتن به بله">
                        <i class="fa-solid fa-arrow-up-right-from-square"></i>
                    </a>

                    <button class="copy-contact"
                            type="button"
                            data-copy="@mesbah"
                            aria-label="کپی آیدی بله">
                        <i class="fa-regular fa-copy"></i>
                    </button>

                </span>

            </div>


            <!-- Website -->
            <div class="contact-link">

                <span class="contact-link-icon">
                    <i class="fa-solid fa-globe"></i>
                </span>

                <span class="contact-link-content">

                    <span class="contact-link-title">
                        از طریق سایت
                    </span>

                    <span class="contact-link-value">
                        ارسال پیام
                    </span>

                </span>

                <span class="contact-actions">

                    <a href="#"
                    class="contact-action"
                    aria-label="ارسال پیام">
                        <i class="fa-solid fa-arrow-up-right-from-square"></i>
                    </a>

                </span>

            </div>

        </div>

    </section>

</main>

    <!-- Footer -->
    <div
        id="footer"
        data-component="components/footer.html">
    </div>

    <script src="js/global.js"></script>

</body>

</html>

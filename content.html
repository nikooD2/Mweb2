<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>محتوا | سامانه مصباح</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/content.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>

    <!-- ================= HEADER ================= -->

    <div id="header"></div>


    <!-- ================= CONTENT ================= -->

    <main class="page">


        <!-- =====================================================
             VIDEO
        ====================================================== -->

        <section id="video-layout"
                 class="content-main video-layout">

            <!-- VIDEO -->

            <div class="video-box">

                <video id="content-video"
                       controls
                       playsinline>

                    <source id="video-source"
                            src=""
                            type="video/mp4">

                    مرورگر شما از پخش ویدیو پشتیبانی نمی‌کند.

                </video>

            </div>


            <!-- VIDEO INFORMATION -->

            <div class="video-information">

                <h1 id="video-title"></h1>


                <div id="video-topic"
                     class="content-tags">
                </div>


                <a id="video-speaker"
                   class="speaker-profile"
                   href="#">

                    <div id="speaker-avatar"
                         class="speaker-avatar">

                        <span id="speaker-initial"></span>

                    </div>

                    <span id="video-speaker-name"></span>

                </a>


                <!-- TRANSCRIPT -->

                <section id="video-transcript-section"
                         class="transcript-section">

                    <div id="video-transcript"
                         class="transcript-text collapsed">
                    </div>

                    <button id="video-transcript-more"
                            class="transcript-more"
                            type="button">

                        بیشتر

                        <i class="fa-solid fa-chevron-down"></i>

                    </button>

                </section>


                <!-- ACTIONS -->

                <div class="content-actions">

                    <button type="button"
                            class="content-action">

                        <i class="fa-solid fa-download"></i>

                        <span>دانلود</span>

                    </button>


                    <button type="button"
                            class="content-action">

                        <i class="fa-solid fa-share-nodes"></i>

                        <span>اشتراک</span>

                    </button>


                    <button type="button"
                            class="content-action save-action">

                        <i class="fa-regular fa-bookmark"></i>

                        <span>ذخیره</span>

                    </button>

                </div>


                <!-- =================================================
                     AUDIO WITH VIDEO
                ================================================== -->

                <section id="video-audio-section"
                        class="audio-layout">

                    <div class="audio-divider"></div>

                    <div class="audio-cover-container">

                        <img id="video-audio-cover"
                            class="audio-cover"
                            src=""
                            alt="">

                    </div>
                    <div class="audio-information">

                        <h1 id="audio-title"> صوت </h1>
                    </div>


                    <div class="audio-player">

                        <audio id="video-audio">

                            <source id="video-audio-source"
                                    src=""
                                    type="audio/mpeg">

                        </audio>


                        <div class="audio-progress">

                            <span id="video-audio-current">
                                00:00
                            </span>

                            <input id="video-audio-progress"
                                type="range"
                                min="0"
                                max="100"
                                value="0">

                            <span id="video-audio-duration">
                                00:00
                            </span>

                        </div>


                        <div class="audio-controls">

                            <button id="video-audio-prev"
                                    type="button"
                                    class="audio-control">

                                <i class="fa-solid fa-backward-step"></i>

                            </button>


                            <button id="video-audio-play"
                                    type="button"
                                    class="audio-play">

                                <i class="fa-solid fa-play"></i>

                            </button>


                            <button id="video-audio-next"
                                    type="button"
                                    class="audio-control">

                                <i class="fa-solid fa-forward-step"></i>

                            </button>

                        </div>

                    </div>


                    <div class="content-actions audio-actions">

                        <button type="button"
                                class="content-action">

                            <i class="fa-solid fa-download"></i>

                            <span>دانلود</span>

                        </button>


                        <button type="button"
                                class="content-action">

                            <i class="fa-solid fa-share-nodes"></i>

                            <span>اشتراک</span>

                        </button>


                        <button type="button"
                                class="content-action save-action">

                            <i class="fa-regular fa-bookmark"></i>

                            <span>ذخیره</span>

                        </button>

                    </div>

                </section>

            </div>

        </section>


        <!-- =====================================================
             AUDIO ONLY
        ====================================================== -->

        <section id="audio-layout"
                 class="content-main audio-layout">

            <div class="audio-cover-container">

                <img id="audio-cover"
                     class="audio-cover"
                     src=""
                     alt="">

            </div>


            <div class="audio-information">

                <h1 id="audio-title"></h1>


                <div id="audio-tags"
                     class="content-tags audio-tags">
                </div>


                <div class="audio-player">

                    <audio id="content-audio">

                        <source id="audio-source"
                                src=""
                                type="audio/mpeg">

                    </audio>


                    <div class="audio-progress">

                        <span id="audio-current">
                            00:00
                        </span>


                        <input id="audio-progress-bar"
                               type="range"
                               min="0"
                               max="100"
                               value="0">


                        <span id="audio-duration">
                            00:00
                        </span>

                    </div>


                    <div class="audio-controls">

                        <button id="audio-prev"
                                type="button"
                                class="audio-control">

                            <i class="fa-solid fa-backward-step"></i>

                        </button>


                        <button id="audio-play"
                                type="button"
                                class="audio-play">

                            <i class="fa-solid fa-play"></i>

                        </button>


                        <button id="audio-next"
                                type="button"
                                class="audio-control">

                            <i class="fa-solid fa-forward-step"></i>

                        </button>

                    </div>

                </div>


                <!-- TRANSCRIPT -->

                <section id="audio-transcript-section"
                         class="transcript-section">

                    <div id="audio-transcript"
                         class="transcript-text collapsed">
                    </div>


                    <button id="audio-transcript-more"
                            class="transcript-more"
                            type="button">

                        بیشتر

                        <i class="fa-solid fa-chevron-down"></i>

                    </button>

                </section>


                <!-- ACTIONS -->

                <div class="content-actions audio-actions">

                    <button type="button"
                            class="content-action">

                        <i class="fa-solid fa-download"></i>

                        <span>دانلود</span>

                    </button>


                    <button type="button"
                            class="content-action">

                        <i class="fa-solid fa-share-nodes"></i>

                        <span>اشتراک</span>

                    </button>


                    <button type="button"
                            class="content-action save-action">

                        <i class="fa-regular fa-bookmark"></i>

                        <span>ذخیره</span>

                    </button>

                </div>

            </div>

        </section>

        <section class="content-group">
            <!-- ---------------- VIDEO ---------------- -->
            <section class="content-row">

                <div class="content-row-header">

                    <h2 data-content-info="topic">
                        ویدیو های جدید
                    </h2>

                    <a
                        href="results.html?type=newest-video"
                        class="view-all"
                    >
                        مشاهده همه

                        <i class="fa-solid fa-arrow-left"></i>
                    </a>

                </div>


                <div
                    class="content-slider"
                    data-xml="data/newest.xml"
                    data-type="video"
                ></div>

            </section>

            <!-- ---------------- AUDIO ---------------- -->
            <section class="content-row">

                <div class="content-row-header">

                    <h2 data-content-info="topic">
                        صوت های جدید
                    </h2>

                    <a
                        href="results.html?type=newest-audio"
                        class="view-all"
                    >
                        مشاهده همه

                        <i class="fa-solid fa-arrow-left"></i>
                    </a>

                </div>


                <div
                    class="content-slider"
                    data-xml="data/newest.xml"
                    data-type="audio"
                ></div>

            </section>

            <!-- -------------- PLAYLISTS -------------- -->
            <section class="content-row">

                <div class="content-row-header">

                    <h2>
                        مجموعه‌های مرتبط
                    </h2>

                    <a
                        href="playlists.html"
                        class="view-all"
                    >
                        مشاهده همه

                        <i class="fa-solid fa-arrow-left"></i>
                    </a>

                </div>


                <div
                    class="content-slider"
                    data-xml="data/playlists.xml"
                    data-type="playlist"
                ></div>

            </section>

            <!-- ---------------- VIDEO ---------------- -->
            <section class="content-row">

                <div class="content-row-header">

                    <h2 data-content-info="speaker">
                        ویدیو های جدید از
                    </h2>

                    <a
                        href="results.html?type=newest-video"
                        class="view-all"
                    >
                        مشاهده همه

                        <i class="fa-solid fa-arrow-left"></i>
                    </a>

                </div>


                <div
                    class="content-slider"
                    data-xml="data/newest.xml"
                    data-type="video"
                ></div>

            </section>

            <!-- ---------------- AUDIO ---------------- -->
            <section class="content-row">

                <div class="content-row-header">

                    <h2 data-content-info="speaker">
                        صوت های جدید از
                    </h2>

                    <a
                        href="results.html?type=newest-audio"
                        class="view-all"
                    >
                        مشاهده همه

                        <i class="fa-solid fa-arrow-left"></i>
                    </a>

                </div>


                <div
                    class="content-slider"
                    data-xml="data/newest.xml"
                    data-type="audio"
                ></div>

            </section>
        </section>
    </main>


    <!-- ================= JS ================= -->

    <script src="js/global.js"></script>
    <script src="js/content.js"></script>
    <script src="js/cards.js"></script>
    <script src="js/rows.js"></script>

</body>

</html>
